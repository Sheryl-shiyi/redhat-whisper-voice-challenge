# Swedish-conference venue file. Copy to values-conference.yaml and use the SAME file on every install/upgrade.
game:
  requiredLanguage: "en"

registration:
  mode: "username"

tournament:
  enabled: true

# Swedish-audience language pools: Scandinavian/Nordic first, non-Latin scripts in Hard.
difficultyPools: |
  {
    "easy": ["sv", "en", "no", "da", "de", "es", "fr", "pl"],
    "medium": ["sv", "en", "no", "da", "de", "es", "fr", "pl", "fi", "is", "nl", "it", "pt", "tr", "hu"],
    "hard": ["sv", "en", "no", "da", "de", "es", "fr", "pl", "fi", "is", "nl", "it", "pt", "tr", "hu", "uk", "ar", "zh", "ja", "ko", "th", "hi", "bg", "ka"]
  }

